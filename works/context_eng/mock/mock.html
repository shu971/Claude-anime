<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
  :root { --paper:#f5f3ee; --ink:#111214; --sub:#6b6d72; --line:#dcd9d2; --acc:#2f6bff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#000; font-family:'Noto Sans JP',sans-serif; color:var(--ink); }
  .v { position:absolute; inset:0; background:url(bg.jpg) center/cover; }
  .abs { position:absolute; }
  .tag { position:absolute; left:40px; top:40px; background:#000c; color:#fff; font:800 34px 'Noto Sans JP'; padding:10px 22px; border-radius:12px; z-index:50; }

  /* 字幕：白いピルに黒文字 */
  .sub { position:absolute; left:50%; transform:translateX(-50%); background:#fff; color:var(--ink); font-weight:800; font-size:46px;
         line-height:1.25; padding:12px 30px; border-radius:18px; white-space:nowrap; box-shadow:0 6px 24px #0003; }
  .sub b { color:var(--acc); }

  /* カード */
  .card { position:absolute; background:var(--paper); border-radius:40px; box-shadow:0 18px 50px #0004; }
  .eq { font-weight:800; letter-spacing:.02em; }
  .chip { display:inline-block; background:var(--acc); color:#fff; border-radius:999px; padding:8px 26px; font-weight:800; }
  .tile { position:absolute; width:150px; height:150px; border-radius:28px; background:#fff; border:3px solid var(--line);
          display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .tile .k { font-size:30px; font-weight:700; color:var(--sub); line-height:1; }
  .tile .n { font-size:58px; font-weight:900; line-height:1.1; color:var(--acc); }
  .tile.q { border:4px solid var(--ink); }
  .tile.q .n { color:var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || '0';
const R = document.getElementById('root');
const html = {
// 0：顔の範囲と空いている場所
'0': `
  <div class="v"></div>
  <div class="tag">0　顔の範囲と置き場所</div>
  <div class="abs" style="left:0;top:0;width:1080px;height:200px;background:#0008"></div>
  <div class="abs" style="left:0;top:1560px;width:1080px;height:360px;background:#0008"></div>
  <div class="abs" style="left:950px;top:1000px;width:130px;height:560px;background:#0008"></div>
  <div class="abs" style="left:110px;top:180px;width:650px;height:760px;border:8px dashed #ff4d4d;border-radius:40px"></div>
  <div class="abs" style="left:60px;top:980px;width:880px;height:560px;border:8px solid #3ddc84;border-radius:40px;background:#3ddc8422"></div>
  <div class="abs" style="left:140px;top:205px;color:#ff4d4d;font:900 40px 'Noto Sans JP';text-shadow:0 2px 8px #000">顔（髪〜あご）</div>
  <div class="abs" style="left:90px;top:1000px;color:#fff;font:900 40px 'Noto Sans JP';text-shadow:0 2px 8px #000">解説を出す場所（8〜9割はここ）</div>
  <div class="abs" style="left:40px;top:120px;color:#fff;font:700 30px 'Noto Sans JP'">SNSの表示で隠れる</div>
  <div class="abs" style="left:40px;top:1600px;color:#fff;font:700 30px 'Noto Sans JP'">SNSの表示で隠れる（キャプション・ボタン）</div>
`,
// A：白いカードに数式
'A': `
  <div class="v"></div>
  <div class="tag">A　白いカード</div>
  <div class="sub" style="top:968px">でも、<b>b＝−1</b>と分かれば</div>
  <div class="card" style="left:80px;top:1070px;width:850px;height:440px">
    <div class="abs eq" style="left:0;width:850px;top:70px;text-align:center;font-size:110px">2a − 3<span style="color:var(--acc)">b</span> = 5</div>
    <div class="abs" style="left:0;width:850px;top:250px;text-align:center;font-size:56px">
      <span class="chip">b ＝ −1</span>
      <span style="font-weight:900;margin:0 26px;color:var(--sub)">→</span>
      <span class="eq" style="font-size:72px">a ＝ 1</span>
    </div>
  </div>
`,
// B：10個の未知数が1つずつ埋まる
'B': `
  <div class="v"></div>
  <div class="tag">B　未知数のマス</div>
  <div class="sub" style="top:968px">BからJまでの<b>9つの値</b>がわかれば</div>
  <div class="card" style="left:80px;top:1070px;width:850px;height:440px" id="grid"></div>
`,
// C：強調の瞬間だけ全面を使う（顔が小さい丸窓に縮む）
'C': `
  <div class="abs" style="inset:0;background:var(--paper)"></div>
  <div class="tag">C　強調（一時的に全面）</div>
  <div class="abs" style="left:390px;top:230px;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 10px 40px #0003">
    <div style="position:absolute;left:-37px;top:-91px;width:466px;height:829px;background:url(bg.jpg) 0 0/466px 829px"></div>
  </div>
  <div class="abs" style="left:0;width:1080px;top:640px;text-align:center;font-size:54px;font-weight:700;color:var(--sub)">大事なのは</div>
  <div class="abs" style="left:0;width:1080px;top:740px;text-align:center;font-weight:900;line-height:1.15">
    <div style="font-size:92px;color:var(--sub);text-decoration:line-through;text-decoration-thickness:8px">役割を与える</div>
    <div style="font-size:124px;margin-top:20px">前提情報を<span style="color:var(--acc)">渡す</span></div>
  </div>
  <div class="abs" style="left:0;width:1080px;top:1250px;text-align:center">
    <span class="chip" style="font-size:52px;padding:14px 40px">コンテキストエンジニアリング</span>
  </div>
`,
}[v];
R.innerHTML = html;
if (v === 'B') {
  const g = document.getElementById('grid');
  const vals = { B:3, C:-2, D:7, E:0, F:5, G:1, H:-4, I:2, J:6 };
  'ABCDEFGHIJ'.split('').forEach((k, i) => {
    const col = i % 5, row = Math.floor(i / 5);
    const t = document.createElement('div');
    t.className = 'tile' + (k === 'A' ? ' q' : '');
    t.style.left = (35 + col * 160) + 'px';
    t.style.top = (55 + row * 175) + 'px';
    t.innerHTML = `<div class="k">${k}</div><div class="n">${k === 'A' ? '?' : vals[k]}</div>`;
    g.appendChild(t);
  });
}
window.ready = document.fonts.ready.then(() => document.fonts.load("900 40px 'Noto Sans JP'")).then(() => true);
</script>
</body>
</html>
